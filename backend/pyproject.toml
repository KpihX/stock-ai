[project]
name = "stock-ai"
version = "0.2.0"
description = "Agentic AI for the food supply chain: voice orders, demand forecasting and supervised purchasing"
readme = "README.md"
authors = [{ name = "Ivann Kamdem", email = "kapoivha@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "pydantic>=2",
    "pydantic-ai",
    "httpx",
    "edge-tts",
    "json5>=0.17.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "openai>=1.40",
    "sse-starlette>=2.0",
    "pyjwt>=2.8",
    "nvidia-riva-client>=2.28.0",
]

[project.optional-dependencies]
forecast = [
    "statsforecast",
    "darts",
]
voice = [
    "pipecat-ai",
]
decision = [
    "von-sdk>=1.3.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]

[project.scripts]
stock-ai = "stockline_ai.cli:app"
stock-api = "stockline_ai.api.main:run"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stockline_ai"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/stockline_ai/api/admin.py" = ["E501"]  # embedded HTML/JS dashboard

[tool.stockline_ai.contract]
schema_version = "stockline.contract.v1"
source = "CONTRACT.md"
# The contract version follows [project].version and is never repeated here.
