name: stockline-ai

services:
  postgres:
    image: postgres:17-alpine
    container_name: stockline-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${DB_NAME:-stockline}
      POSTGRES_USER: ${DB_USER:-stockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockline}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockline}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      stockline:
        aliases:
          - stockline-postgres

  api:
    build:
      context: ./backend
    container_name: stockline-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STOCKLINE_DATABASE_URL: postgresql://${DB_USER:-stockline}:${POSTGRES_PASSWORD:-stockline}@stockline-postgres:5432/${DB_NAME:-stockline}
      STOCKLINE_API_URL: http://localhost:8000
      STOCKLINE_FRONTEND_URL: ${STOCKLINE_FRONTEND_URL:-https://stockline-ai.vercel.app}
      WHATS_PROXY_STATE_DIR: /app/wa-state
    ports:
      - "40000-40020:40000-40020/udp"
    volumes:
      - ./backend/config.jsonc:/app/config.jsonc
      - wa_session:/app/wa-state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.stockline.rule=Host(`stockline-ai.kpihx-labs.com`)"
      - "traefik.http.routers.stockline.entrypoints=websecure"
      - "traefik.http.routers.stockline.tls=true"
      - "traefik.http.routers.stockline.tls.certresolver=myresolver"
      - "traefik.http.routers.stockline.middlewares=stockline-headers"
      - "traefik.http.routers.stockline-fallback.rule=Host(`stockline-ai.homelab`)"
      - "traefik.http.routers.stockline-fallback.entrypoints=websecure"
      - "traefik.http.routers.stockline-fallback.tls=true"
      - "traefik.http.routers.stockline-fallback.middlewares=stockline-headers"
      - "traefik.http.services.stockline.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.stockline-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.stockline-headers.headers.contenttypenosniff=true"
    networks:
      - proxy
      - stockline

volumes:
  pg_data:
  wa_session:

networks:
  proxy:
    external: true
  stockline:
    driver: bridge
