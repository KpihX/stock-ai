name: stock-ai

services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${DB_NAME:-stockline}
      POSTGRES_USER: ${DB_USER:-stockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockline}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockline}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      stock:
        aliases:
          - stock-postgres

  api:
    build:
      context: ./backend
    container_name: stock-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STOCKLINE_DATABASE_URL: postgresql://${DB_USER:-stockline}:${POSTGRES_PASSWORD:-stockline}@stock-postgres:5432/${DB_NAME:-stockline}
      STOCKLINE_API_URL: http://localhost:8000
      STOCKLINE_FRONTEND_URL: ${STOCKLINE_FRONTEND_URL:-https://stock-ai.kpihx-labs.com}
      WHATS_PROXY_STATE_DIR: /app/wa-state
    ports:
      - "40000-40020:40000-40020/udp"
    volumes:
      - ./backend/config.jsonc:/app/config.jsonc
      - wa_session:/app/wa-state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.stock.rule=Host(`stock-api.kpihx-labs.com`)"
      - "traefik.http.routers.stock.entrypoints=websecure"
      - "traefik.http.routers.stock.tls=true"
      - "traefik.http.routers.stock.tls.certresolver=myresolver"
      - "traefik.http.routers.stock.middlewares=stock-headers"
      - "traefik.http.routers.stock-fallback.rule=Host(`stock-api.homelab`)"
      - "traefik.http.routers.stock-fallback.entrypoints=websecure"
      - "traefik.http.routers.stock-fallback.tls=true"
      - "traefik.http.routers.stock-fallback.middlewares=stock-headers"
      - "traefik.http.services.stock.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.stock-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.stock-headers.headers.contenttypenosniff=true"
    networks:
      - proxy
      - stock

volumes:
  pg_data:
  wa_session:

networks:
  proxy:
    external: true
  stock:
    driver: bridge
