stages:
  - deploy
  - sync

variables:
  DOCKER_DRIVER: overlay2

deploy_homelab:
  stage: deploy
  tags:
    - homelab
  only:
    - main
  script:
    - echo "DEBUG=false" > .env
    - echo "JWT_SECRET=$JWT_SECRET" >> .env
    - echo "NVIDIA_API_KEY=$NVIDIA_API_KEY" >> .env
    - echo "DB_NAME=stockline" >> .env
    - echo "DB_USER=stockline" >> .env
    - echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
    - echo "STOCKLINE_ADMIN_PASSWORD=$STOCKLINE_ADMIN_PASSWORD" >> .env
    - docker compose build --no-cache
    - docker compose up -d --remove-orphans
    - docker image prune -f
  after_script:
    - docker run --rm -v "$PWD:/work" alpine chown -R $(id -u):$(id -g) /work

sync_github:
  stage: sync
  only:
    - main
  variables:
    GITHUB_ORG: "kpihx-labs"
    REPO_NAME: "stockline-ai"
  script:
    - curl -H "Authorization: token ${GITHUB_TOKEN}" -X POST -d "{\"name\":\"${REPO_NAME}\",\"private\":true}" https://api.github.com/orgs/${GITHUB_ORG}/repos || true
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_ORG}/${REPO_NAME}.git || git remote set-url github https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_ORG}/${REPO_NAME}.git
    - git push github $CI_COMMIT_SHA:refs/heads/main --force
